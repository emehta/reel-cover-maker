name: Pages

# Every push to main is checked, built as a static site and published to
# GitHub Pages: https://emehta.github.io/reel-cover-maker/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than racing an older one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The tests import TypeScript directly; Node strips the types on its
          # own from 23.6, so no build step is needed for them.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Where Pages serves the site: base_path is "/reel-cover-maker" at
      # emehta.github.io, and empty on a domain of its own, so the build is
      # right for either without a change here.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
