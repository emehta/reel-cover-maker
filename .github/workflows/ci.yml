name: CI

# A push to main is checked by the Pages workflow before it deploys; this
# checks a pull request before it gets there.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The tests import TypeScript directly; Node strips the types on its
          # own from 23.6, so no build step is needed.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
